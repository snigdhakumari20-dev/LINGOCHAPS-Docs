<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Quiz Answer Key — Internal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 40px 20px; }
        .card { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 2.5rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .badge { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #64748b; margin-bottom: 2rem; line-height: 1.6; }
        .btn { background: #4f46e5; color: #fff; border: none; padding: 0.9rem 2rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { background: #6366f1; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Internal Use Only</div>
        <h1>PM Onboarding Quiz — Answer Key</h1>
        <p>Download the complete reference document with all questions, correct answers, and explanations. Do not share this link with testers.</p>
        <button class="btn" onclick="downloadReferenceDoc()">Download Answer Key (.doc)</button>
    </div>
    <script>
const QUIZ_QUESTIONS = [
            {
                category: "CAT Tools & TM",
                question: "What is the primary purpose of a Translation Memory (TM) in CAT tools such as Phrase (Memsource) or MemoQ?",
                options: [
                    "It automatically translates the entire document using AI engines, removing the need for human linguists.",
                    "It stores previously translated source and target segments to suggest matching content for identical or similar sentences in new files.",
                    "It automatically plays the client's video file at a slower speed to help translators catch accurate timestamps.",
                    "It acts as a dictionary database that only contains single-word terminology definitions and exclusions."
                ],
                correctAnswer: 1,
                explanation: "Translation Memories (TMs) save pairs of translated sentences (segments). When identical or similar sentences appear, the CAT tool suggests the saved translation to ensure stylistic consistency and speed up translation workflows."
            },
            {
                category: "Phrase vs. MemoQ",
                question: "As a Project Manager, how do you decide whether to use Phrase (Memsource) or MemoQ for a YouTube project?",
                options: [
                    "Phrase is primarily web/cloud-based and is used for collaborative real-time editing; MemoQ is preferred for offline resources or complex projects requiring extensive desktop CAT resources.",
                    "Phrase is configured only for European languages, while MemoQ is only used for Asian languages.",
                    "MemoQ translates video files automatically using text-to-speech, whereas Phrase only handles plain text documents.",
                    "There is no difference between the two; they are identical systems hosted on the Lingo Chaps network."
                ],
                correctAnswer: 0,
                explanation: "Phrase is highly agile and collaborative because it is native to the cloud. MemoQ has strong desktop capabilities that allow handlers and reviewers to process large offline packages, custom TM schemas, and complex layout configurations."
            },
            {
                category: "Client C1 Templates",
                question: "When delivering completed translations to Client C1, which of the following represents the MANDATORY format for timestamp annotations?",
                options: [
                    "Just write the translated content without timestamps to make formatting easier.",
                    "[HH:MM:SS] Target Translation only.",
                    "[HH:MM:SS] Target Translation + Origin Text (verbatim speech in source language) + Context Explanations & Notes (including abbreviation meanings).",
                    "[MM:SS] Target Translation translated with machine translation tools."
                ],
                correctAnswer: 2,
                explanation: "Client C1 requires full-context records: the timestamp, target translation, the exact verbatim source text (origin text), and contextual annotations or explanatory notes (especially for abbreviations)."
            },
            {
                category: "Live Client Scenario",
                question: "A client email states: 'The video is in English but has Arabic speech from 01:23 to 01:45. Please check.' What is the PM's correct action?",
                options: [
                    "Ignore the Arabic speech segments because the client requested an English translation guide.",
                    "Translate it using public machine translation tools and paste it into the file without telling the client.",
                    "Notify the client, verify whether translation of the Arabic portion is required, and align a bilingual resource to handle the segment (negotiating an ETA extension if needed).",
                    "Cancel the project immediately to avoid mixing languages in the translation tracking sheet."
                ],
                correctAnswer: 2,
                explanation: "Under Lingo Chaps protocols, if a foreign language is detected inside the video, you must report it to the client, obtain verification on whether the additional segment needs translation, and allocate resources or adjust the ETA accordingly."
            },
            {
                category: "Immediate Action Protocol",
                question: "An urgent client WhatsApp comes in: 'Need this 15-minute video translated in 1.5 hours.' According to the Lingo Chaps Rapid Response standard, what is the PM's sequence of actions?",
                options: [
                    "Wait 30 minutes to check if any translator answers, then reply to the client.",
                    "Reply to the client immediately (zero delay), analyze length/ETA, download assets locally (never share the client's direct link), and launch the Triple-Path Sourcing strategy (Direct Contact, Upwork Post, Offline Sync).",
                    "Forward the client's drive link directly to active translators on Skype to save time.",
                    "Decline the task immediately because a 15-minute video cannot be completed by a single resource in 1.5 hours."
                ],
                correctAnswer: 1,
                explanation: "Immediate response is critical. You must reply immediately, securely intake files (isolated from direct client drive links), and execute parallel outreach to multiple linguists (splitting resource allocation if the volume demands it)."
            },
            {
                category: "Backup & Sync Safeguard",
                question: "Why does Lingo Chaps require Project Managers to download and save backups of live translator sheets/documents locally at regular intervals?",
                options: [
                    "To monitor the translator's computer processing speed.",
                    "To prove to the Project Director that the PM is keeping their browser open.",
                    "To safeguard work progress in case a translator drops off, goes offline, or accidentally/intentionally deletes the shared file, protecting our delivery commitment.",
                    "To upload the backup zip file to the client's backup drive every 30 minutes."
                ],
                correctAnswer: 2,
                explanation: "Maintaining regular local backups prevents loss of progress if a translator drops out or a technical failure/accidental deletion occurs on the cloud doc. Backups are mandatory for all projects regardless of length."
            },
            {
                category: "CAT Termbase (TB)",
                question: "What is a Termbase (TB) in CAT tools, and how does it help a Project Manager maintain quality control?",
                options: [
                    "It is the billing repository that registers segment word counts to calculate payment rates.",
                    "It is an integrated glossary containing approved terms, brand names, and translation rules that prompts linguists in real-time, preventing naming deviations.",
                    "It is a backup drive partition on local computers used for storing raw audio/video streams.",
                    "It is an automated script that checks if timestamps are formatted correctly."
                ],
                correctAnswer: 1,
                explanation: "A Termbase (TB) acts as an active glossary inside the CAT editor. It ensures terminology uniformity by flagging brand names, specific abbreviations, and approved translations in real-time."
            },
            {
                category: "Security Safeguards",
                question: "What is the mandatory protocol for handling Google Drive links received directly from a client?",
                options: [
                    "Share the link directly with translators on Skype or WhatsApp to start immediately.",
                    "Download the files/video locally, upload them to the Lingo Chaps internal project Drive, and share only the internal Drive link with translators.",
                    "Open the file in Google Drive, generate a public shareable link with editor access, and email it to the team.",
                    "Translate the files directly in the client's Drive without downloading them to local storage."
                ],
                correctAnswer: 1,
                explanation: "The Isolated Intake safeguard mandates that we never share the client's direct Drive link with translators. You must download the files/video locally, upload them to the internal project Drive under the designated date folder, and share only the internal link."
            },
            {
                category: "Security Safeguards",
                question: "According to the Storage Cleanup Protocol, when is a Project Manager permitted to delete locally downloaded videos and backup files?",
                options: [
                    "Immediately after confirming the email delivery of the files to the client.",
                    "After a 24-hour buffer period post-delivery to ensure no immediate client revisions or download issues occur.",
                    "Only when the local hard drive is completely full and starts affecting operating system performance.",
                    "Exactly 30 days after project completion, as long as the translator has been paid."
                ],
                correctAnswer: 1,
                explanation: "To optimize space while ensuring file safety, locally downloaded videos and backup files can be cleared after a 24-hour (1-day) buffer period following successful delivery to the client."
            },
            {
                category: "Operational Guidelines",
                question: "What is the requirement for Lingo Chaps shift handlers and reviewers regarding the Google Meet Virtual Room?",
                options: [
                    "It is optional and should only be joined if a translator asks for a live call.",
                    "Join the Google Meet virtual room at the start of your shift and stay connected (muted/video off) at all times for instant collaboration.",
                    "Keep your camera and microphone on at all times to monitor translator desk activity.",
                    "It is only required for the first 15 minutes of a project shift to align tasks."
                ],
                correctAnswer: 1,
                explanation: "Shift handlers and reviewers must stay connected to the Google Meet virtual room at all times (muted/video off) during their shifts to enable real-time communication and immediate resolution of project questions."
            },
            {
                category: "Operational Guidelines",
                question: "When a new task is accepted, what hierarchy must a Project Manager follow to source resources?",
                options: [
                    "Step 1: Consult a Senior Manager to post a job; Step 2: Search public online translation directories.",
                    "Step 1: Perform an Internal Search (Language List Excel Sheet + WhatsApp/Upwork); Step 2: Escalation (check prior Upwork job posts of same language, or consult a Senior Manager to post a new job).",
                    "Step 1: Message any online translator on Skype; Step 2: Translate the video internally using machine translation.",
                    "Step 1: Post on Upwork; Step 2: Wait for translators to apply via email."
                ],
                correctAnswer: 1,
                explanation: "Lingo Chaps' resource sourcing hierarchy dictates that you first perform an Internal Search by consulting the Language List spreadsheet and contacting known resources. If there's no response, escalate by checking prior Upwork job posts or consulting a senior manager to post a new job."
            },
            {
                category: "Security Safeguards",
                question: "What is the correct protocol when delivering the final translated work to a client?",
                options: [
                    "Send the link to the internal working template so the client can review live progress.",
                    "Copy the text from the translator's spreadsheet and paste it directly into an email body.",
                    "Migrate the completed work into the client's master template, add the client-shared video link, verify everything, and deliver that file (never sharing internal template links).",
                    "Upload the internal Lingo Chaps template to Google Drive and grant public access to the client."
                ],
                correctAnswer: 2,
                explanation: "Under the Secure Delivery protocol, you must never share internal template links. Migrate the completed work into the client's master template using a new separate template, add the client-shared video link, and deliver that file after verification."
            },
            {
                category: "Environment Setup",
                question: "Why is a dedicated Chrome profile named 'Lingo Chaps' and specific bookmark structures required for all shift handlers?",
                options: [
                    "To allow the browser to auto-fill the Project Manager's personal credit card details.",
                    "To keep Lingo Chaps translation work, tracking sheets, and internal credentials isolated, preventing credential leaks and enabling fast navigation.",
                    "To improve internet download speeds when retrieving client videos.",
                    "Because Google Chrome does not allow opening spreadsheets in default guest windows."
                ],
                correctAnswer: 1,
                explanation: "Creating a dedicated 'Lingo Chaps' Chrome profile keeps company credentials and client tracking sheets isolated from personal data, preventing credential leakage. Organized bookmark folders ensure zero-delay access to tools."
            }
        ];

        function downloadReferenceDoc() {
            const letters = ["A", "B", "C", "D"];
            let questionsHtml = "";
            QUIZ_QUESTIONS.forEach((q, idx) => {
                const optionsHtml = q.options.map((opt, optIdx) => {
                    const isCorrect = optIdx === q.correctAnswer;
                    return `<p class="option ${isCorrect ? "correct" : "incorrect"}">${letters[optIdx]}. ${isCorrect ? "&#10003; " : ""}${opt}</p>`;
                }).join("");
                questionsHtml += `
                    <hr class="divider">
                    <h2>Question ${idx + 1}: ${q.category}</h2>
                    <p class="question">${q.question}</p>
                    ${optionsHtml}
                    <p class="answer-label">Correct Answer:</p>
                    <p class="answer">${letters[q.correctAnswer]} — ${q.options[q.correctAnswer]}</p>
                    <p class="explanation-label">Explanation:</p>
                    <p class="explanation">${q.explanation}</p>`;
            });
            const summaryRows = QUIZ_QUESTIONS.map((q, idx) => {
                const bg = idx % 2 === 0 ? "" : ' style="background:#f8fafc;"';
                return `<tr${bg}><td>Q${idx + 1}</td><td>${q.category}</td><td>${letters[q.correctAnswer]}</td></tr>`;
            }).join("");
            const content = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1e293b;margin:40px;line-height:1.6}h1{font-size:18pt;color:#4f46e5;text-align:center}h2{font-size:13pt;color:#4f46e5;margin-top:24px;border-bottom:1px solid #4f46e5;padding-bottom:4px}.subtitle{text-align:center;color:#64748b;font-size:10pt;margin-bottom:24px}.divider{border:none;border-top:1px solid #e2e8f0;margin:16px 0}.question{font-weight:bold;margin-top:12px}.option{margin-left:20px;margin-bottom:3px}.option.correct{color:#166534;font-weight:bold}.option.incorrect{color:#64748b}.answer-label,.explanation-label{font-size:9pt;text-transform:uppercase;color:#64748b;margin-top:8px}.answer{color:#166534;font-weight:bold}.explanation{background:#f8fafc;border-left:3px solid #4f46e5;padding:6px 10px;margin:4px 0 12px 0}</style></head><body><h1>Lingo Chaps — PM Onboarding & CAT Tool Quiz</h1><p class="subtitle">Question & Answer Reference Guide • All ${QUIZ_QUESTIONS.length} Questions</p>${questionsHtml}<hr class="divider"><h2>Quick Summary — Correct Answers</h2><table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:10pt;"><tr style="background:#4f46e5;color:white;"><th>#</th><th>Category</th><th>Answer</th></tr>${summaryRows}</table><p style="text-align:center;font-size:9pt;color:#94a3b8;margin-top:40px;">&copy; 2026 Lingo Chaps — Internal use only.</p></body></html>`;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'LingoChaps_PM_Quiz_Answer_Key.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
